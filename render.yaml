services:
  - type: web
    name: guns-viewbot
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    buildCommand: bash render_build.sh
    startCommand: python guns_viewbot.py
    envVars:
      - key: PORT
        value: 10000
      - key: THREADS
        value: 35
      - key: TARGET_URL
        value: https://guns.lol/osintowner
